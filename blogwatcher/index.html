<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA Run Results</title><style>
:root{color-scheme:dark;--bg:#101214;--panel:#181b1f;--line:#30363d;--text:#f3f4f6;--muted:#9ba3af;--accent:#ffb454;--good:#8ee6b2;--bad:#ff8c8c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#3b2a16,transparent 35%),var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1100px;margin:auto;padding:44px 22px 80px}.eyebrow{color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:12px}h1{font-size:clamp(32px,5vw,56px);line-height:1.05;letter-spacing:-.04em;margin:12px 0}.intro{color:var(--muted);max-width:700px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:24px 0}.panel{background:#181b1fee;border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0}button{background:var(--accent);border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer}.muted{color:var(--muted)}.status{display:inline-block;padding:4px 9px;border-radius:99px;background:#30363d}.completed{color:var(--good)}.failed{color:var(--bad)}pre{background:#0a0c0e;border:1px solid var(--line);border-radius:9px;padding:14px;white-space:pre-wrap;overflow:auto;font-size:12px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}a{color:var(--accent);word-break:break-all}.empty{text-align:center;padding:50px;color:var(--muted)}
</style></head><body><main><div class="eyebrow">AdsPower · website QA</div><h1>Run results</h1><p class="intro">Saved local companion reports appear here when copied into this page’s <code>reports/</code> data directory. The page never receives AdsPower credentials.</p><div class="toolbar"><button id="refresh">Refresh results</button><span id="updated" class="muted"></span></div><div id="results"><div class="panel empty">Loading saved results…</div></div></main><script>
const RESULTS_KEY='qaRunReports';const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function show(){let items=[];try{const published=await (await fetch('results.json',{cache:'no-store'})).json();if(Array.isArray(published))items=published;else if(published&&published.results)items=[published]}catch{}try{const local=JSON.parse(localStorage.getItem(RESULTS_KEY)||'[]');if(Array.isArray(local))items=items.concat(local)}catch{}$('updated').textContent=`${items.length} saved report${items.length===1?'':'s'} · ${new Date().toLocaleString()}`;if(!items.length){$('results').innerHTML='<div class="panel empty">No saved reports found.</div>';return}$('results').innerHTML=items.slice().reverse().map(r=>{const rows=(r.results||[]).map(x=>`<tr><td>${esc(x.profile_id)}</td><td class="${esc(x.status)}">${esc(x.status)}</td><td>${x.product_url?`<a href="${esc(x.product_url)}" target="_blank" rel="noreferrer">${esc(x.product_url)}</a>`:'—'}</td><td>${x.error?esc(x.error):'—'}</td></tr>`).join('');return `<section class="panel"><h2>${esc(r.test_name||'QA run')} <span class="status">${esc(r.summary?.completed||0)} completed / ${esc(r.summary?.failed||0)} failed</span></h2><p class="muted">${esc(r.started_at||'')} · ${esc(r.duration_seconds||0)}s</p><table><thead><tr><th>Profile</th><th>Status</th><th>Product page reached</th><th>Error</th></tr></thead><tbody>${rows}</tbody></table><details><summary>Run log and raw report</summary><pre>${esc((r.log||[]).join('\n'))}\n\n${esc(JSON.stringify(r,null,2))}</pre></details></section>`}).join('')}$('refresh').addEventListener('click',show);show();
</script></body></html>
